# =====================================================================
# DocuVault — Render Blueprint
#
# Creates, in one click:
#   • docuvault-api    Node web service (Express backend) + 10GB persistent disk
#   • docuvault-redis  Redis-compatible Key Value instance (BullMQ job queue)
#
# MySQL is deliberately NOT here: Render has no managed MySQL. Create a free
# tier at Aiven and supply the DB_* values in the dashboard (see DEPLOY.md).
#
# Every secret below is `sync: false`, so Render PROMPTS you for it when you
# create the blueprint. Nothing sensitive is ever committed to this file.
#
# Usage: Render dashboard → New → Blueprint → point it at this repo.
# =====================================================================

services:
  - type: web
    name: docuvault-api
    runtime: node
    region: oregon
    # 1 CPU / 2 GB. This is the minimum that works: Puppeteer runs a real
    # headless Chromium, which alone wants ~400MB, so the 512MB Starter plan
    # gets OOM-killed mid-PDF-generation. Also the cheapest plan that allows
    # attaching a persistent disk (free plans cannot).
    plan: 1c-2g
    rootDir: server
    buildCommand: npm ci
    # Runs on EVERY deploy, after the build and before the service starts. This
    # is what creates the database tables on the very first deploy — without it
    # the service boots, cannot reach any table, and 500s on every request until
    # you run the migration by hand. Idempotent, so later deploys are a no-op.
    preDeployCommand: npm run migrate
    startCommand: npm start
    healthCheckPath: /api/health

    # Persists generated PDFs, logos, avatars, seals, bulk ZIPs and the archive
    # across redeploys. Without this, every deploy wipes server/storage/ and all
    # previously generated documents become undownloadable while the database
    # rows still point at them.
    disk:
      name: docuvault-storage
      mountPath: /var/data
      sizeGB: 10

    # NOTE: this service must stay at exactly 1 instance while it has a disk.
    # A disk is per-instance state, so a second instance gets its own copy of
    # storage/ and bulk-PDF jobs land on a machine that cannot see files another
    # instance wrote. Render also refuses to scale a service that has a disk.

    envVars:
      - key: NODE_ENV
        value: production

      # ── Filesystem ──────────────────────────────────────────────────────
      # Must match the disk mountPath above.
      - key: STORAGE_ROOT
        value: /var/data

      # ── MySQL (from Aiven — see DEPLOY.md step 1) ───────────────────────
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL
        value: 'true'
      - key: DB_SSL_REJECT_UNAUTHORIZED
        value: 'true'
      # Aiven requires TLS and the server must be given its CA certificate.
      # Paste it as a SINGLE line with the line breaks written as literal \n:
      #   -----BEGIN CERTIFICATE-----\nMIIBkTCB...\n-----END CERTIFICATE-----
      - key: DB_SSL_CA
        sync: false

      # ── Redis: wired in automatically from the Key Value instance below ─
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: docuvault-redis
          property: connectionString

      # ── Frontend origin(s) — comma-separated. Add Vercel preview URLs here. ─
      # Filled in after the Vercel deploy, then the service is redeployed.
      - key: CLIENT_URL
        sync: false

      # ── Secrets: auto-generated by Render, do not type anything for these ──
      - key: JWT_SECRET
        generateValue: true
      - key: HMAC_SECRET
        generateValue: true
      - key: EXTERNAL_DB_ENC_KEY
        generateValue: true

      # ── Email (Google App Password) ─────────────────────────────────────
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: '587'
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_FROM_NAME
        value: DocuVault

      # ── NTP signing timestamps (FR-026) ─────────────────────────────────
      - key: NTP_SERVER
        value: pool.ntp.org
      - key: NTP_PORT
        value: '123'
      - key: NTP_TIMEOUT_MS
        value: '3000'

  - type: keyvalue
    name: docuvault-redis
    region: oregon
    # 256MB is plenty for a job queue. Plan IDs are size-based: free / 256mb /
    # 1g / 5g / 10g / 20g / 40g. There is no `runtime` field on keyvalue.
    plan: 256mb
    # BullMQ holds queued jobs here, so evicted keys are lost work.
    # Render's own guidance for job queues is `noeviction`, not the
    # `allkeys-lru` default (which would silently drop pending jobs).
    maxmemoryPolicy: noeviction
    # Survives restarts/upgrades. Not available on the free plan — that is
    # another reason this is a paid instance.
    persistenceMode: journal-snapshot
    # ipAllowList is REQUIRED for Key Value instances. An empty list means
    # internal-network only, so the queue is unreachable from the internet.
    ipAllowList: []
